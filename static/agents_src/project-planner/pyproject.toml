[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-organizer"
version = "0.1.0"
description = "A modular project organization agent for managing tasks, notes, and milestones."
authors = [
    { name = "Your Name" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }

dependencies = [
    "jsonschema>=4.21",
    "python-dateutil>=2.8",
    "click>=8.1",
    "rich>=13.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I"]