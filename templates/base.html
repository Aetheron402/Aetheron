<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Aetheron{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/style.css">

  <link rel="icon" href="/static/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png">
  <link rel="manifest" href="/static/favicon/site.webmanifest">
  <meta name="theme-color" content="#030712">
</head>

<body class="font-sans {% block body_class %}{% endblock %}">

  <!-- HEADER -->
  <header class="px-6 py-2 flex justify-between items-center relative">

  <!-- LOGO -->
  <h1 onclick="window.location.href='/'"
      class="ml-2 flex items-center gap-4 cursor-pointer group select-none">

    <img src="/static/favicon/favicon.svg"
          alt="Aetheron"
          class="w-16 h-16 transition-transform duration-200
                group-hover:scale-105" />

    <span class="hidden sm:inline text-base font-semibold text-white tracking-tight">
      X402
    </span>
  </h1>

    <!-- DESKTOP NAV -->
    <nav class="desktop-nav hidden md:flex gap-6 text-sm items-center">
      <a href="https://github.com/Aetheron402" target="_blank" class="text-[rgba(250,250,250,0.56)] hover:text-white transition-colors">GitHub</a>
      <a href="https://x.com/Aetheron402" target="_blank" class="text-[rgba(250,250,250,0.56)] hover:text-white transition-colors">X</a>
      <a href="/learn" class="text-[rgba(250,250,250,0.56)] hover:text-white transition-colors">Learn</a>
      <a href="/sdk" class="text-[rgba(250,250,250,0.56)] hover:text-white transition-colors">SDK</a>
      <a href="/roadmap" class="text-[rgba(250,250,250,0.56)] hover:text-white transition-colors">Roadmap</a>
      <a href="/legal" class="text-[rgba(250,250,250,0.56)] hover:text-white transition-colors">Legal</a>

      <span id="system-status" class="pill hidden sm:inline-flex select-none">
        Network operational
      </span>

      <button id="connect-wallet"
        class="btn btn-ghost text-xs px-3 py-1.5">
        Connect Wallet
      </button>
    </nav>

    <!-- MOBILE MENU BUTTON -->
    <button class="mobile-menu-btn md:hidden text-[rgba(250,250,250,0.72)] hover:text-white text-2xl transition-colors" onclick="toggleMobileMenu()">☰</button>

    <!-- MOBILE NAV -->
    <nav id="mobile-nav"
        class="hidden flex-col gap-4 bg-[#0a0a0a]/95 backdrop-blur border-t border-[rgba(255,255,255,0.08)] p-5 absolute left-0 right-0 top-full z-50 md:hidden">

      <a href="https://github.com/Aetheron402" target="_blank" class="text-[rgba(250,250,250,0.72)] hover:text-white transition-colors">GitHub</a>
      <a href="https://x.com/Aetheron402" target="_blank" class="text-[rgba(250,250,250,0.72)] hover:text-white transition-colors">X</a>
      <a href="/learn" class="text-[rgba(250,250,250,0.72)] hover:text-white transition-colors">Learn</a>
      <a href="/sdk" class="text-[rgba(250,250,250,0.72)] hover:text-white transition-colors">SDK</a>
      <a href="/roadmap" class="text-[rgba(250,250,250,0.72)] hover:text-white transition-colors">Roadmap</a>
      <a href="/legal" class="text-[rgba(250,250,250,0.72)] hover:text-white transition-colors">Legal</a>

      <span id="system-status-mobile" class="pill select-none">
        Network operational
      </span>

      <button id="mobile-connect-wallet"
        class="btn w-full">
        Connect Wallet
      </button>
    </nav>
  </header>

  <style>
    :root{
      /* Neutral near-black rather than blue-black, so the accent is the only
         colour on the page and therefore actually reads as one. */
      --bg: #0a0a0a;
      --surface: #111113;
      --surface-2: #16161a;
      --panel: #111113;
      --panel-strong: #0d0d0f;

      /* Borders are white at low alpha. A tinted border on every edge is what
         made the old layout look busy. */
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.16);

      --text: #fafafa;
      --muted: rgba(250,250,250,0.56);
      --muted-2: rgba(250,250,250,0.38);

      /* The logo blue, kept for state and emphasis only. */
      --accent: #3b82f6;
      --accent-soft: rgba(59,130,246,0.13);
      --ok: #10b981;

      --radius: 10px;
      --radius-lg: 16px;

      /* Retained so any rule still referencing them stays valid. */
      --cyan: #3b82f6;
      --cyan-2: #60a5fa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    html {
      overflow-y: scroll;
    }

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 15;
      pointer-events: none;
    }

    header > * {
      position: relative;
      z-index: 2;
    }

    /* One faint wash near the top instead of three saturated blooms. The page
       should read as near-black with content on it, not as a lit backdrop. */
    .bg-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(70% 45% at 50% -8%, rgba(59,130,246,0.10), transparent 70%);
      opacity: 1;
    }

    /* Scanlines and the vignette were the loudest part of the old treatment.
       Kept as no-ops so existing markup does not need touching. */
    .scanlines { display: none; }
    .vignette  { display: none; }

    .particle {
      position: absolute;
      background: rgba(255,255,255,0.16);
      border-radius: 50%;
      width: 1px;
      height: 1px;
      animation: floatUp linear infinite;
      will-change: transform, opacity;
    }

    @keyframes floatUp {
      0%   { transform: translateY(110vh); opacity: 0; }
      20%  { opacity: 1; }
      100% { transform: translateY(-12vh); opacity: 0; }
    }

    .app-shell {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: relative;
      z-index: 20;

      min-height: 80px;

      isolation: isolate;

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: linear-gradient(
        180deg,
        rgba(3,7,18,0.65) 0%,
        rgba(3,7,18,0.25) 100%
      );
    }

    header,
    header * {
      transition: none !important;
    }

    /* Primary action: solid, high contrast, no glow. A button should look
       pressable because of its contrast, not because it is emitting light. */
    .btn{
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      background: #fafafa;
      color: #0a0a0a;
      font-weight: 500;
      font-size: .875rem;
      line-height: 1.25rem;
      padding: .625rem 1.1rem;
      border: 1px solid transparent;
      border-radius: var(--radius);
      transition: background .16s ease, border-color .16s ease, color .16s ease, opacity .16s ease;
      cursor: pointer;
    }
    .btn:hover{ background: #e4e4e7; }
    .btn:active{ background: #d4d4d8; }
    .btn:disabled, .btn[disabled]{ opacity: .45; cursor: not-allowed; }

    /* Secondary action: outline only. */
    .btn-ghost{
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border-strong);
    }
    .btn-ghost:hover{ background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.28); }
    .btn-ghost:active{ background: rgba(255,255,255,0.10); }

    .btn-accent{ background: var(--accent); color: #fff; }
    .btn-accent:hover{ background: #2f6fe0; }

    .modal-bg{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 70;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .modal{
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: min(520px, 92vw);
      padding: 1.5rem;
      box-shadow: 0 24px 70px rgba(0,0,0,0.6);
    }

    /* Flat surface, one hairline border. Lift on hover comes from the border
       brightening, not from a drop shadow and a translate. */
    .card{
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      transition: border-color .18s ease, background .18s ease;
    }
    .card:hover{
      border-color: var(--border-strong);
      background: var(--surface-2);
    }

    .pill{
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: 0.25rem 0.7rem;
      border-radius: 9999px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: 0;
      text-transform: none;
    }
    /* Status dot, the way Axon marks live state. */
    .pill::before{
      content: "";
      width: 6px; height: 6px;
      border-radius: 9999px;
      background: var(--ok);
      flex: none;
    }
    .pill.pill-plain::before{ display: none; }

    .filter-bar{
      display:flex;
      flex-wrap:wrap;
      gap:.5rem;
      justify-content:center;
    }

    .filter-chip{
      padding: 0.4rem 0.85rem;
      font-size: 0.8125rem;
      letter-spacing: 0;
      text-transform: none;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 9999px;
      transition: background .16s ease, border-color .16s ease, color .16s ease;
      cursor: pointer;
      user-select: none;
    }

    .filter-chip:hover{
      color: var(--text);
      background: rgba(255,255,255,0.05);
      border-color: var(--border-strong);
    }

    .filter-chip.active{
      color: #0a0a0a;
      background: #fafafa;
      border-color: #fafafa;
      font-weight: 500;
    }

    /* Headings, matching Axon's fade from full white into a softer tail. */
    .h-display{
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      background: linear-gradient(180deg, var(--text), rgba(250,250,250,0.62));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .divider{ border-top: 1px solid var(--border); }
    .muted{ color: var(--muted); }

    input, textarea, select {
      color-scheme: dark;
    }

    @media (max-width: 768px){
      .modal{ max-height: 85vh; overflow-y: auto; }
      textarea, .code-input { max-height: 40vh; resize: vertical; }
    }

    @media (prefers-reduced-motion: reduce){
      body{ transition:none; }
      .particle{ animation:none; opacity:0.35; }
      .card, .btn, .filter-chip{ transition:none; }
      .scanlines{ opacity:0.18; }
    }

    .wallet-btn {
      background: linear-gradient(180deg, #22d3ee, #0ea5e9);
      color: #001018;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35);
      transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    }

    .wallet-btn:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
    }

    .wallet-btn:active {
      transform: translateY(0) scale(0.98);
    }

    header::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -32px;
      height: 32px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(3,7,18,0.25),
        rgba(3,7,18,0.0)
      );
    }

    @keyframes page-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .page-fade {
      animation: page-fade 0.55s ease-out both;
    }

    #mobile-nav {
      will-change: transform;
    }
  </style>

  <!-- Ambient background -->
  <div class="background" aria-hidden="true">
    <div class="bg-gradient"></div>
    <div id="particle-container"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
  </div>

  <div class="app-shell">

    <!-- PAGE CONTENT -->
    <main class="px-6 py-16 md:py-20 max-w-6xl mx-auto w-full">
      {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer class="divider mt-20 text-center text-sm text-[rgba(250,250,250,0.38)] px-6 py-10">
      © 2025 Aetheron · Powered by the X402 protocol.
      <div class="space-x-4 mt-2">
        <a href="https://github.com/Aetheron402" target="_blank" class="hover:text-white transition-colors">GitHub</a>
        <a href="https://x.com/Aetheron402" target="_blank" class="text-[rgba(250,250,250,0.56)] hover:text-white transition-colors">X</a>
        <a href="/learn" class="hover:text-white transition-colors">Learn</a>
        <a href="/roadmap" class="hover:text-white transition-colors">Roadmap</a>
        <a href="/legal" class="hover:text-white transition-colors">Legal</a>
      </div>
    </footer>
  </div>

  <!-- Wallet Selection Modal -->
  <div id="wallet-select-modal" class="modal-bg" style="display:none;">
    <div class="modal text-center">
      <h3 class="text-white text-base font-semibold mb-4 tracking-tight">Choose Wallet</h3>

      <button id="phantom-btn" class="btn mb-3 w-full flex items-center justify-center gap-2">
        Phantom Wallet
      </button>

      <button class="btn btn-ghost w-full flex flex-col items-center justify-center gap-0.5 cursor-not-allowed opacity-45"
              disabled>
        <span>MetaMask</span>
        <span class="text-xs text-gray-400">Coming Q1 2026</span>
      </button>

      <p class="text-xs text-gray-400 mt-4 cursor-pointer hover:underline"
         onclick="document.getElementById('wallet-select-modal').style.display='none'">
        Cancel
      </p>
    </div>
  </div>

  <!-- Ambient particles init -->
  <script>
    (function initParticles(){
      const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduced) return;

      const container = document.getElementById("particle-container");
      if (!container) return;

      const count = 80;
      for (let i = 0; i < count; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = (Math.random() * 100) + "%";
        p.style.opacity = (0.25 + Math.random() * 0.5).toFixed(2);
        p.style.animationDuration = (4 + Math.random() * 10) + "s";
        p.style.animationDelay = (Math.random() * 6) + "s";
        container.appendChild(p);
      }
    })();
  </script>

  <!-- WALLET JS -->
  <script>
    let currentWallet = "";
    let currentChain  = "";
    window.currentWallet = "";
    const walletBtn = document.getElementById("connect-wallet");

    function shorten(addr) { return "🔗 " + addr.slice(0,4) + "..." + addr.slice(-4); }

    function updateWalletUI() {
      const mobileWalletBtn = document.getElementById("mobile-connect-wallet");
      if (!currentWallet) {
        walletBtn.textContent = "Connect Wallet";
        if (mobileWalletBtn) mobileWalletBtn.textContent = "Connect Wallet";
        return;
      }
      walletBtn.textContent = shorten(currentWallet);
      if (mobileWalletBtn) mobileWalletBtn.textContent = shorten(currentWallet);
    }

    async function connectPhantom() {
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      const hasPhantom = !!window.solana?.isPhantom;

      // MOBILE: redirect into Phantom app browser
      if (isMobile && !hasPhantom) {
        const target = encodeURIComponent(window.location.href);
        window.location.href = `https://phantom.app/ul/browse/${target}`;
        return;
      }

      // DESKTOP without Phantom
      if (!hasPhantom) {
        alert("Please install the Phantom browser extension to continue.");
        return;
      }

      try {
        await window.solana.disconnect().catch(() => {});
        const res = await window.solana.connect({ onlyIfTrusted: false });
        currentWallet = res.publicKey.toString();
        currentChain = "solana";
        window.currentWallet = currentWallet;
        updateWalletUI();
        window.dispatchEvent(new Event("wallet:connected"));
      } catch (err) {
        console.error(err);
      }

      document.getElementById("wallet-select-modal").style.display = "none";
    }

    async function connectMetamask() {
      if (!window.ethereum) { alert("MetaMask not found"); return; }
      try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        currentWallet = accounts[0];
        currentChain = "ethereum";
        updateWalletUI();
      } catch(err) {
        console.error(err);
      }
      document.getElementById("wallet-select-modal").style.display = "none";
    }

    walletBtn.addEventListener("click", () => {
      if (!currentWallet) {
        document.getElementById("wallet-select-modal").style.display = "flex";
      } else {
        if (confirm("Disconnect wallet?")) {
          currentWallet = "";
          currentChain = "";
          window.currentWallet = "";
          updateWalletUI();
        }
      }
    });

    document.getElementById("phantom-btn").onclick = connectPhantom;
  </script>

  <script>
    const mobileWalletBtn = document.getElementById("mobile-connect-wallet");
    if (mobileWalletBtn) {
      mobileWalletBtn.addEventListener("click", () => {
        if (!currentWallet) {
          document.getElementById("wallet-select-modal").style.display = "flex";
        } else {
          if (confirm("Disconnect wallet?")) {
            currentWallet = "";
            currentChain = "";
            window.currentWallet = "";
            updateWalletUI();
          }
        }
      });
    }
  </script>

  <script>
    async function registerPayment({ txSig, payMethod }) {
      if (!currentWallet) throw new Error("Wallet not connected");
      return { txSig, wallet: currentWallet, method: payMethod || "USDC" };
    }
  </script>

  <script>
    function toggleMobileMenu() {
      const nav = document.getElementById("mobile-nav");
      if (!nav) return;
      nav.classList.toggle("hidden");
      nav.classList.toggle("flex");
    }
  </script>

  <script>
    async function requestTxSignature() {
      const sig = prompt("Paste your transaction signature:");
      if (!sig) throw new Error("Transaction signature required");
      return sig.trim();
    }
  </script>

  <script>
    function forceClosePaymentModal() {
      const modal = document.getElementById("payment-modal");
      if (!modal) return;
      modal.style.display = "none";
      modal.classList.remove("flex");
      document.body.style.pointerEvents = "auto";
    }
  </script>

  <script>
    const globalLocks = {};
    function lock(key) { if (globalLocks[key]) return false; globalLocks[key] = true; return true; }
    function unlock(key) { globalLocks[key] = false; }
    async function safeJson(res) {
      const text = await res.text();
      try { return JSON.parse(text); }
      catch { return { error: "Invalid JSON response", raw: text.slice(0, 200) }; }
    }
  </script>

  <script>
    let lastStatusCheck = Date.now();
    function timeAgo(ts) {
      const sec = Math.floor((Date.now() - ts) / 1000);
      if (sec < 5) return "just now";
      if (sec < 60) return `${sec}s ago`;
      return `${Math.floor(sec / 60)}m ago`;
    }

    async function checkSystemStatus() {
      const els = [
        document.getElementById("system-status"),
        document.getElementById("system-status-mobile")
      ].filter(Boolean);

      if (!els.length) return;

      function setOperational() {
        lastStatusCheck = Date.now();
        els.forEach(el => {
          el.innerHTML = `
            <span class="relative group flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span>Network operational</span>
              <span class="absolute top-full mt-2 left-1/2 -translate-x-1/2
                           whitespace-nowrap text-xs text-gray-300
                           bg-black/80 border border-white/10
                           rounded-md px-2 py-1 opacity-0
                           pointer-events-none transition
                           group-hover:opacity-100">
                Last check: ${timeAgo(lastStatusCheck)}
              </span>
            </span>
          `;
          el.classList.remove("text-yellow-400");
          el.classList.add("text-emerald-400");
        });
      }

      function setDegraded() {
        els.forEach(el => {
          el.innerHTML = `
            <span class="w-2 h-2 rounded-full bg-yellow-400"></span>
            Network degraded
          `;
          el.classList.remove("text-emerald-400");
          el.classList.add("text-yellow-400");
        });
      }

      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        const json = await res.json();
        json?.ok === true ? setOperational() : setDegraded();
      } catch {
        setDegraded();
      }
    }

    checkSystemStatus();
    setInterval(checkSystemStatus, 15000);
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
